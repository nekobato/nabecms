name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ">=11"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Package smoke
        run: pnpm package:smoke

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Publish packages
        env:
          NPM_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: |
          npm publish output/packages/nekobato-nabecms-core-*.tgz --access public --tag "${NPM_TAG}"
          npm publish output/packages/nekobato-nabecms-admin-*.tgz --access public --tag "${NPM_TAG}"
          npm publish output/packages/nekobato-nabecms-[0-9]*.tgz --access public --tag "${NPM_TAG}"
          npm publish output/packages/nekobato-nabecms-cli-*.tgz --access public --tag "${NPM_TAG}"
          npm publish output/packages/create-nabecms-*.tgz --access public --tag "${NPM_TAG}"
