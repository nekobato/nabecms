packages:
  - packages/*
  - examples/*
  - docs

engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
pmOnFail: error

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  workerd: true

